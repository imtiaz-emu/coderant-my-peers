name: Profile ownership

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  ownership:
    name: Check profile ownership
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute the pull request's code in this workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { checkProfileOwnership } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/check-profile-ownership.mjs`).href
            );
            const pr = context.payload.pull_request;
            if (pr.changed_files > 3000) {
              throw new Error('This PR exceeds the file-list API limit. Split it into smaller PRs.');
            }
            let maintainer = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: pr.user.login
              });
              maintainer = data.permission === 'admin' || data.role_name === 'maintain';
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Author is not a repository collaborator; self-service restrictions apply.');
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100
            });
            checkProfileOwnership({
              author: pr.user.login,
              maintainer,
              files
            });
